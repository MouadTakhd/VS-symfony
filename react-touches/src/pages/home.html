<!-- #/  ·  controller: home.ts  ·  every data-ref below is declared in home.ts -->
<section data-title="Home" class="space-y-8">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Patient Registry</h1>
    <p class="mt-1 text-sm text-gray-500">Patients and their allergies, live from the JSON database.</p>
  </div>

  <p data-ref="error" hidden class="rounded-md bg-red-50 p-3 text-sm text-red-700"></p>

  <dl class="grid gap-4 sm:grid-cols-3">
    <div class="card">
      <dt class="text-sm text-gray-500">Patients</dt>
      <dd data-ref="patients" class="mt-2 text-3xl font-semibold">–</dd>
    </div>
    <div class="card">
      <dt class="text-sm text-gray-500">Recorded allergies</dt>
      <dd data-ref="allergies" class="mt-2 text-3xl font-semibold">–</dd>
    </div>
    <div class="card">
      <dt class="text-sm text-gray-500">Life-threatening</dt>
      <dd data-ref="critical" class="mt-2 text-3xl font-semibold text-red-600">–</dd>
    </div>
  </dl>
 <div class="card overflow-hidden p-0">
  <!-- toolbar: title on the left, search on the right -->
  <div class="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 sm:flex-row sm:items-center sm:justify-between">
    <h2 class="text-sm font-semibold">Most recent visits</h2>

    <form data-ref="searchForm" role="search" class="relative w-full sm:w-72">
      <label for="patient-search" class="sr-only">Search patients</label>
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
        <svg class="h-4 w-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
      </div>
      <input
        data-ref="search"
        id="patient-search"
        type="search"
        autocomplete="off"
        placeholder="Search name, ID or ward..."
        class="block w-full rounded-lg border border-gray-300 bg-white py-2 pl-9 pr-3 text-sm text-gray-900
               placeholder:text-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
      />
    </form>
  </div>

  <!-- table -->
  <div class="overflow-x-auto">
    <table class="min-w-full text-left text-sm">
      <thead class="bg-gray-50 text-xs uppercase tracking-wide text-gray-500">
        <tr>
          <th scope="col" class="px-5 py-3 font-medium">Patient</th>
          <th scope="col" class="px-5 py-3 font-medium">ID</th>
          <th scope="col" class="px-5 py-3 font-medium">Ward</th>
          <th scope="col" class="px-5 py-3 font-medium">Last visit</th>
          <th scope="col" class="px-5 py-3 font-medium">Allergies</th>
        </tr>
      </thead>
      <tbody data-ref="recent" id="searchItem" class="divide-y divide-gray-100"></tbody>
    </table>

    <p data-ref="empty" hidden class="px-5 py-8 text-center text-sm text-gray-500">
      No patients match your search.
    </p>
  </div>
</div>

<!-- one row per patient; {{ … }} is filled by renderList() in home.ts -->
<template data-ref="recentRow">
  <tr class="hover:bg-gray-50">
    <td class="px-5 py-3">
      <a href="#/patients/{{ id }}" class="font-semibold text-gray-900 hover:underline">{{ name }}</a>
    </td>
    <td class="px-5 py-3 text-gray-500">{{ id }}</td>
    <td class="px-5 py-3 text-gray-500">{{ ward }}</td>
    <td class="whitespace-nowrap px-5 py-3 text-gray-500">{{ visit }}</td>
    <td class="px-5 py-3"><span class="badge {{ allergyClass }}">{{ allergyLabel }}</span></td>
  </tr>
</template>
